<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-2 sidebar vh-100 p-3 d-flex flex-column">
          <h5 class="mb-4 fw-bold text-white">ASLAB</h5>
          <nav class="nav flex-column gap-2 flex-grow-1">
            <a class="nav-link active text-white" href="dashboard.html"
              >Dashboard</a
            >
            <a class="nav-link text-white" href="kegiatan.html"
              >Manajemen Kegiatan</a
            >
            <a class="nav-link text-white" href="peminjaman.html"
              >Laporan Inventaris</a
            >
          </nav>
          <div class="mt-auto">
            <hr class="text-white opacity-50" />
            <a class="nav-link text-white" href="#" onclick="logout()"
              >Logout</a
            >
          </div>
        </div>
        <div class="col-10 p-0">
          <nav class="navbar navbar-light bg-white border-bottom px-4">
            <span class="navbar-brand mb-0 h5">Dashboard</span>
            <span>Admin</span>
          </nav>

            <div class="row">
              <div class="col-md-6 mb-3">
                <div
                  class="card shadow-sm border-0 border-start border-primary border-4"
                >
                  <div class="card-body">
                    <h6 class="text-muted fw-bold">Total Kegiatan Tersedia</h6>
                    <h2
                      class="display-5 fw-bold text-primary"
                      id="angka-kegiatan"
                    >
                      0
                    </h2>
                  </div>
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <div
                  class="card shadow-sm border-0 border-start border-success border-4"
                >
                  <div class="card-body">
                    <h6 class="text-muted fw-bold">
                      Total Mahasiswa Mendaftar
                    </h6>
                    <h2
                      class="display-5 fw-bold text-success"
                      id="angka-pendaftar"
                    >
                      0
                    </h2>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
