<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Kegiatan</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-2 sidebar vh-100 p-3 d-flex flex-column">
          <h5 class="mb-4 fw-bold text-white">ASLAB</h5>
          <nav class="nav flex-column gap-2 flex-grow-1">
            <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
            <a class="nav-link active text-white" href="kegiatan.html"
              >Manajemen Kegiatan</a
            >
            <a class="nav-link text-white" href="peminjaman.html"
              >Laporan Inventaris</a
            >
          </nav>
          <div class="mt-auto">
            <hr class="text-white opacity-50" />
            <a class="nav-link text-white" href="#" onclick="logout()"
              >Logout</a
            >
          </div>
        </div>

        <div class="col-10 p-0 bg-light">
          <nav class="navbar bg-white border-bottom px-4">
            <span class="navbar-brand fw-semibold">Manajemen Kegiatan</span>
            <span>Admin</span>
          </nav>

          <div class="p-4">
            <div class="card shadow-sm mb-4">
              <div class="card-body">
                <h5>Tambah Kegiatan</h5>
                <form id="formKegiatan" class="row g-2 mt-2">
                  <div class="col-md-4">
                    <input
                      type="text"
                      id="namaKegiatan"
                      name="judul"
                      class="form-control"
                      placeholder="Nama Kegiatan"
                      required
                    />
                  </div>
                  
                  <div class="col-md-3">
                    <select id="kategoriKegiatan" name="kategori" class="form-select" required>
                      <option value="" disabled selected>Pilih Kategori...</option>
                      <option value="Seminar">Seminar</option>
                      <option value="Workshop">Workshop</option>
                      <option value="Lomba">Lomba</option>
                      <option value="Umum">Umum</option>
                    </select>
                  </div>

                  <div class="col-md-3">
                    <input
                      type="date"
                      id="tanggalKegiatan"
                      name="tanggal"
                      class="form-control"
                      required
                    />
                  </div>
                  
                  <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">
                      Tambah
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <div class="card shadow-sm mb-4">
              <div class="card-body">
                <h5>Daftar Kegiatan</h5>
                <table class="table table-bordered mt-3">
                  <thead>
                    <tr>
                      <th>Nama Kegiatan</th>
                      <th>Kategori</th> <th>Tanggal</th>
                      <th>Status</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody id="tabelKegiatan"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
