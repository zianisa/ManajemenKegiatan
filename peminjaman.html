<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Laporan Inventaris</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">
    <div class="container-fluid">
      <div class="row">
        <div class="col-2 sidebar vh-100 p-3 d-flex flex-column bg-dark">
          <h5 class="mb-4 fw-bold text-white">ASLAB</h5>
          <nav class="nav flex-column gap-2 flex-grow-1">
            <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
            <a class="nav-link text-white" href="kegiatan.html"
              >Manajemen Kegiatan</a
            >
            <a class="nav-link active text-white fw-bold" href="peminjaman.html"
              >Laporan Inventaris</a
            >
          </nav>
          <div class="mt-auto">
            <hr class="text-white opacity-50" />
            <a class="nav-link text-white" href="#" onclick="logout()"
              >Logout</a
            >
          </div>
        </div>

        <div class="col-10 p-0">
          <nav class="navbar bg-white border-bottom px-4 py-3 shadow-sm">
            <span class="navbar-brand fw-bold text-secondary"
              >Laporan Peminjaman Inventaris</span
            >
            <span class="badge bg-primary px-3 py-2">Admin Panel</span>
          </nav>

          <div class="p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="fw-bold text-dark">Daftar Pengajuan Masuk</h5>
              <button
                class="btn btn-primary shadow-sm"
                onclick="loadDataPeminjaman()"
              >
                <i class="bi bi-arrow-clockwise"></i> Refresh Data
              </button>
            </div>

            <div class="card shadow-sm border-0">
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary">
                      <tr>
                        <th class="ps-4">No</th>
                        <th>NIM Mahasiswa</th>
                        <th>Kegiatan</th>
                        <th>Barang Dipinjam</th>
                        <th>Tanggal Pengajuan</th>
                        <th>Status</th>
                        <th class="pe-4 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody id="tabel-peminjaman">
                      <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                          Memuat data dari database...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>

    <script>
      async function loadDataPeminjaman() {
        const tbody = document.getElementById("tabel-peminjaman");
        tbody.innerHTML =
          '<tr><td colspan="7" class="text-center py-4">Memuat data...</td></tr>';

        try {
          const response = await fetch(`${BASE_API}/get_peminjaman.php`);
          const result = await response.json();

          if (result.status === "success") {
            if (result.data.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="7" class="text-center py-4 text-muted">Belum ada pengajuan peminjaman.</td></tr>';
              return;
            }

            tbody.innerHTML = result.data
              .map((item, index) => {
                // 1. Warna Badge yang lebih detail
                let badgeClass = "bg-warning text-dark"; // Menunggu
                if (item.status_pinjam === "Disetujui")
                  badgeClass = "bg-info text-dark"; // Siap diambil
                if (item.status_pinjam === "Dipinjam")
                  badgeClass = "bg-primary"; // Sedang dipakai
                if (item.status_pinjam === "Dikembalikan")
                  badgeClass = "bg-success"; // Selesai
                if (item.status_pinjam === "Ditolak") badgeClass = "bg-danger";

                let tgl = new Date(item.tanggal_pengajuan).toLocaleDateString(
                  "id-ID",
                  { day: "numeric", month: "short", year: "numeric" },
                );

                // 2. Logika Tombol Aksi Admin
                let actionButtons = "";
                if (item.status_pinjam === "Menunggu Konfirmasi") {
                  // Tombol ACC / Tolak
                  actionButtons = `
                  <button class="btn btn-sm btn-success me-1" onclick="ubahStatus(${item.id}, 'Disetujui')" title="Setujui">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="ubahStatus(${item.id}, 'Ditolak')" title="Tolak">
                    <i class="bi bi-x-lg"></i>
                  </button>
                `;
                } else if (item.status_pinjam === "Dipinjam") {
                  // Tombol Konfirmasi Pengembalian
                  actionButtons = `
                  <button class="btn btn-sm btn-primary" onclick="ubahStatus(${item.id}, 'Dikembalikan')" title="Tandai Dikembalikan">
                    <i class="bi bi-box-arrow-in-down"></i> Terima Barang
                  </button>
                `;
                } else if (item.status_pinjam === "Disetujui") {
                  actionButtons = `<span class="text-muted small">Menunggu mhs mengambil barang</span>`;
                } else {
                  actionButtons = `<span class="text-muted small"><i class="bi bi-check2-all"></i> Selesai</span>`;
                }

                return `
              <tr>
                <td class="ps-4">${index + 1}</td>
                <td class="fw-bold">${item.nim}</td>
                <td>${item.nama_kegiatan}</td>
                <td>${item.nama_barang} <span class="badge bg-secondary ms-1">${item.jumlah} pcs</span></td>
                <td>${tgl}</td>
                <td><span class="badge ${badgeClass}">${item.status_pinjam}</span></td>
                <td class="pe-4 text-center">${actionButtons}</td>
              </tr>`;
              })
              .join("");
          }
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">Gagal terhubung ke database.</td></tr>`;
          console.error(e);
        }
      }

      async function ubahStatus(id, statusBaru) {
        if (
          !confirm(
            `Apakah Anda yakin ingin menandai pengajuan ini sebagai "${statusBaru}"?`,
          )
        )
          return;

        const fd = new FormData();
        fd.append("id", id);
        fd.append("status_baru", statusBaru);

        try {
          const res = await fetch(`${BASE_API}/update_status_peminjaman.php`, {
            method: "POST",
            body: fd,
          });
          const result = await res.json();
          if (result.status === "success") {
            loadDataPeminjaman();
          } else {
            alert(result.message);
          }
        } catch (e) {
          alert("Gagal mengubah status. Cek koneksi.");
        }
      }

      window.onload = loadDataPeminjaman;
    </script>
  </body>
</html>
