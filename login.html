<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Activity Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="login-page">
    <div class="card login-card shadow">
      <div class="login-logo">
        <i class="bi bi-arrow-repeat"></i>
      </div>

      <h4 class="text-center fw-bold">Welcome Back</h4>
      <p class="text-center text-muted mb-4">
        Login untuk mengatur aktivitasmu
      </p>

      <form id="formLogin" autocomplete="off">
        <div class="mb-3 position-relative">
          <i class="bi bi-person login-icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control login-input"
            placeholder="Masukkan Username Anda"
            required
          />
        </div>

        <div class="mb-4 position-relative">
          <i class="bi bi-lock login-icon"></i>
          <input
            id="password"
            type="password"
            name="password"
            class="form-control login-input"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="btn btn-login w-100 text-white">
          LOGIN
        </button>
      </form>

      <p class="text-center mt-3 small text-muted">
        Belum punya akun?
        <span class="text-primary" style="cursor: pointer">Daftar</span>
      </p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
